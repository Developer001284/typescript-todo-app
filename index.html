<!DOCTYPE html>
<html>
<head>
<title>En To-Do List</title>
<style>
body{font-family:Arial; text-align:center; margin-top:50px;}
input{padding:10px;}
button{padding:10px; background:blue; color:white; border:none;}
</style>
</head>
<body>
<h1>En To-Do List ✅</h1>
<p>Built by Fathima</p>
<input id="task" placeholder="Enna panna pora?">
<button onclick="add()">Add</button>
<ul id="list"></ul>

<script>
function add(){
  let t = document.getElementById("task").value;
  if(t == "") return;
  let li = document.createElement("li");
  li.textContent = t;
  document.getElementById("list").appendChild(li);
  document.getElementById("task").value = "";
}
</script>
</body>
  </html>
